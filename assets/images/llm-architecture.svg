<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#0f172a" rx="12"/>
  
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22d3ee;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#818cf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c084fc;stop-opacity:1" />
    </linearGradient>
    
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="coloredBlur"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Labels -->
  <text x="120" y="50" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle" font-weight="600">INPUT</text>
  <text x="400" y="50" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle" font-weight="600">TRANSFORMER LAYERS</text>
  <text x="680" y="50" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle" font-weight="600">OUTPUT</text>

  <!-- Input Nodes -->
  <g filter="url(#glow)">
    <circle cx="120" cy="120" r="8" fill="#22d3ee"/>
    <circle cx="120" cy="200" r="8" fill="#22d3ee"/>
    <circle cx="120" cy="280" r="8" fill="#22d3ee"/>
  </g>

  <!-- Hidden Layer 1 -->
  <g filter="url(#glow)">
    <circle cx="280" cy="100" r="8" fill="#818cf8"/>
    <circle cx="280" cy="160" r="8" fill="#818cf8"/>
    <circle cx="280" cy="220" r="8" fill="#818cf8"/>
    <circle cx="280" cy="280" r="8" fill="#818cf8"/>
    <circle cx="280" cy="300" r="8" fill="#818cf8"/>
  </g>

  <!-- Hidden Layer 2 -->
  <g filter="url(#glow)">
    <circle cx="440" cy="120" r="8" fill="#818cf8"/>
    <circle cx="440" cy="180" r="8" fill="#818cf8"/>
    <circle cx="440" cy="240" r="8" fill="#818cf8"/>
    <circle cx="440" cy="300" r="8" fill="#818cf8"/>
  </g>

  <!-- Hidden Layer 3 -->
  <g filter="url(#glow)">
    <circle cx="560" cy="140" r="8" fill="#c084fc"/>
    <circle cx="560" cy="200" r="8" fill="#c084fc"/>
    <circle cx="560" cy="260" r="8" fill="#c084fc"/>
  </g>

  <!-- Output Node -->
  <g filter="url(#glow)">
    <circle cx="680" cy="200" r="12" fill="#f472b6" stroke="#fff" stroke-width="2"/>
  </g>

  <!-- Connections (Representative paths) -->
  <g stroke-width="1" opacity="0.4" stroke="url(#grad1)">
    <!-- Input to L1 -->
    <line x1="120" y1="120" x2="280" y2="100" />
    <line x1="120" y1="120" x2="280" y2="160" />
    <line x1="120" y1="200" x2="280" y2="160" />
    <line x1="120" y1="200" x2="280" y2="220" />
    <line x1="120" y1="280" x2="280" y2="280" />
    <line x1="120" y1="280" x2="280" y2="300" />
    
    <!-- L1 to L2 -->
    <line x1="280" y1="100" x2="440" y2="120" />
    <line x1="280" y1="160" x2="440" y2="180" />
    <line x1="280" y1="220" x2="440" y2="240" />
    <line x1="280" y1="300" x2="440" y2="300" />
    
    <!-- L2 to L3 -->
    <line x1="440" y1="120" x2="560" y2="140" />
    <line x1="440" y1="180" x2="560" y2="200" />
    <line x1="440" y1="240" x2="560" y2="260" />
    <line x1="440" y1="300" x2="560" y2="260" />

    <!-- L3 to Output -->
    <line x1="560" y1="140" x2="680" y2="200" />
    <line x1="560" y1="200" x2="680" y2="200" />
    <line x1="560" y1="260" x2="680" y2="200" />
  </g>

  <!-- Floating Text Description -->
  <text x="400" y="360" fill="#64748b" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" font-style="italic">
    Visualizing the flow from tokenization to next-token prediction
  </text>
</svg>
